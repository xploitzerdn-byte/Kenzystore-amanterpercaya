<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenzy Store - Top Up Game Murah & Cepat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
        }

        /* Navbar */
        nav {
            background-color: #1a1d29;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #30364d;
        }

        nav .logo {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #00ffcc;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #1e1b4b, #311042);
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #a5b4fc;
            font-size: 16px;
        }

        /* Container Game */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-left: 5px solid #00ffcc;
            padding-left: 10px;
        }

        .grid-games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Card Game */
        .card-game {
            background-color: #1a1d29;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #30364d;
            text-decoration: none;
            color: white;
            display: block;
        }

        .card-game:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.2);
            border-color: #00ffcc;
        }

        .card-game img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-game h3 {
            font-size: 16px;
            padding: 12px 5px;
            background-color: #1a1d29;
        }

        /* Footer */
        footer {
            background-color: #0b0c10;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            font-size: 14px;
            color: #666;
            border-top: 1px solid #1a1d29;
        }
    </style>
</head>
<body>

    <!-- Bagian Atas / Navigation -->
    <nav>
        <div class="logo">KENZY STORE</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Cek Transaksi</a></li>
            <li><a href="#">Testimoni</a></li>
        </ul>
    </nav>

    <!-- Banner Promosi -->
    <div class="hero">
        <h1>Top Up Game Tercepat & Terpercaya</h1>
        <p>Layanan otomatis 24 jam non-stop dengan harga termurah.</p>
    </div>

    <!-- Daftar Game -->
    <div class="container">
        <h2 class="section-title">Daftar Game Populer</h2>
        
        <div class="grid-games">
            
            <!-- Item 1: Mobile Legends -->
            <a href="#" class="card-game">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400" alt="Mobile Legends">
                <h3>Mobile Legends</h3>
            </a>

            <!-- Item 2: Free Fire -->
            <a href="#" class="card-game">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400" alt="Free Fire">
                <h3>Free Fire</h3>
            </a>

            <!-- Item 3: PUBG Mobile -->
            <a href="#" class="card-game">
                <img src="https://images.unsplash.com/photo-1553481187-be93c21490a9?w=400" alt="PUBG Mobile">
                <h3>PUBG Mobile</h3>
            </a>

            <!-- Item 4: Genshin Impact -->
            <a href="#" class="card-game">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400" alt="Genshin Impact">
                <h3>Genshin Impact</h3>
            </a>

            <!-- Item 5: Valorant -->
            <a href="#" class="card-game">
                <img src="https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=400" alt="Valorant">
                <h3>Valorant</h3>
            </a>

        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 Kenzy Store. All Rights Reserved.
    </footer>

</body>
  </html>
